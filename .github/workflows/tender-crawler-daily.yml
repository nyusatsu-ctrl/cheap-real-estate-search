name: Daily government tender crawler

on:
  schedule:
    # 06:00 JST every day. GitHub Actions cron uses UTC.
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: daily-government-tender-crawler
  cancel-in-progress: false

jobs:
  crawl-tenders:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TENDER_SUPABASE_URL: ${{ secrets.TENDER_SUPABASE_URL }}
      TENDER_SUPABASE_ANON_KEY: ${{ secrets.TENDER_SUPABASE_ANON_KEY }}
      TENDER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TENDER_SUPABASE_SERVICE_ROLE_KEY }}
      TENDER_PORTAL_FETCH_TIMEOUT_MS: "15000"
      TENDER_PORTAL_MAX_PAGES: "3"
      DEFENSE_CRAWLER_FETCH_TIMEOUT_MS: "8000"
      DEFENSE_CRAWLER_DISABLE_PLAYWRIGHT: "1"
      DEFENSE_CRAWLER_PLAYWRIGHT_TIMEOUT_MS: "15000"
      DEFENSE_CRAWLER_PLAYWRIGHT_MAX_WAIT_MS: "5000"
      DEFENSE_CRAWLER_PLAYWRIGHT_TASK_TIMEOUT_MS: "15000"
      DEFENSE_CRAWLER_SOURCE_TIMEOUT_MS: "30000"
      DEFENSE_CRAWLER_TIME_BUDGET_MS: "480000"
      DEFENSE_CRAWLER_MAX_SOURCES: "25"
      DEFENSE_CRAWLER_FORCE_EXIT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tender Supabase secrets
        run: |
          if [ -z "$TENDER_SUPABASE_URL" ] || [ -z "$TENDER_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::TENDER_SUPABASE_URL and TENDER_SUPABASE_SERVICE_ROLE_KEY repository secrets are required for the tender crawler."
            exit 1
          fi

      - name: Crawl procurement portal tenders
        continue-on-error: true
        timeout-minutes: 5
        run: npm run crawl:tenders -- --limit=300

      - name: Sync defense tender sources
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: npm run discover:defense -- --max-sources=25

      - name: Crawl defense tender candidates
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: npm run crawl:defense -- --max-sources=25

      - name: Summarize tender database
        if: always()
        timeout-minutes: 2
        run: node scripts/tender-db-summary.mjs
