  let astEditorState = null;

  function openAstApplicationEditor() {
    if (!state.selected || state.saving) return;

    astEditorState = {
      sourceRowKey: String(state.selected.rowKey || ''),
      sourceRowNumber: state.selected.rowNumber,

    document.getElementById('astApplicationModal').hidden = true;

  function renderAstApplicationForm(values) {
    const form = document.getElementById('astApplicationForm');
    form.innerHTML = AST_EDITOR_SECTIONS.map((section) => `
      <section class="ast-editor-section">

          ${section.fields.map((field) => astEditorFieldHtml(field, values[field.name])).join('')}
        </div>

  function astEditorFieldHtml(field, rawValue) {
    const value = String(rawValue ?? '');
    const controlId = `ast-field-${field.name}`;
    const span = Math.max(1, Math.min(4, Number(field.span || 1)));
    const className = `ast-field${span > 1 ? ` ast-span-${span}` : ''}`;
    const help = field.help ? `<small>${escapeHtml(field.help)}</small>` : '';
    let control = '';
    if (field.type === 'select') {
      control = `<select id="${escapeHtml(controlId)}" name="${escapeHtml(field.name)}">${field.options.map(([optionValue, label]) => `<option value="${escapeHtml(optionValue)}"${String(optionValue) === value ? ' selected' : ''}>${escapeHtml(label)}</option>`).join('')}</select>`;
    } else if (field.type === 'textarea') {
      control = `<textarea id="${escapeHtml(controlId)}" name="${escapeHtml(field.name)}">${escapeHtml(value)}</textarea>`;
    } else {
      control = `<input id="${escapeHtml(controlId)}" name="${escapeHtml(field.name)}" type="${escapeHtml(field.type || 'text')}" value="${escapeHtml(value)}"${field.inputmode ? ` inputmode="${escapeHtml(field.inputmode)}"` : ''}>`;
    }
    return `<div class="${className}"><label for="${escapeHtml(controlId)}">${escapeHtml(field.label)}</label>${control}${help}</div>`;
  }

  function collectAstApplicationForm() {
    const form = document.getElementById('astApplicationForm');

  function resetAstApplicationForm() {
    if (!astEditorState) return;
    if (!window.confirm('入力中の変更を破棄し、顧客管理から読み込んだ内容へ戻しますか？')) return;
    renderAstApplicationForm(astEditorState.initial);

    createAstApplicationOutput(false);

  function createAstApplicationPdf() {
    createAstApplicationOutput(true);

  function createAstApplicationOutput(autoPrint) {
    if (!astEditorState || state.saving) return;
    const values = collectAstApplicationForm();
    const warnings = validateAstApplication(values);
    renderAstValidation(warnings);
    if (autoPrint && warnings.length > 0) {
      const summary = warnings.slice(0, 6).map((item) => `・${item}`).join('\n');
      if (!window.confirm(`アスト申込書の未入力項目があります。\n${summary}${warnings.length > 6 ? '\n・ほか' : ''}\n\nこのままPDF作成へ進みますか？`)) return;
    }

    const printWindow = window.open('', '_blank');
    if (!printWindow) {
      showToast('プレビュー画面を開けませんでした。ポップアップ許可を確認してください。');
      return;
    }
    printWindow.document.write('<p style="font-family:sans-serif;padding:20px;">アスト申込書を作成中です...</p>');

    const saveToCustomer = autoPrint && document.getElementById('astSaveToCustomer').checked;
    const continueToTemplate = () => loadAstTemplateDataUrl()
      .then((templateDataUrl) => {
        if (!astEditorState || values.sourceRowKey !== astEditorState.sourceRowKey) {
          throw new Error('対象顧客が変更されたため、作成を中止しました。');
        }
        const html = buildAstPrintHtml(values, templateDataUrl, autoPrint, warnings);
        printWindow.document.open();
        printWindow.document.write(html);
        printWindow.document.close();
      })
      .catch((error) => {
        const message = error && error.message ? error.message : String(error);
        printWindow.document.open();
        printWindow.document.write(`<p style="font-family:sans-serif;padding:20px;color:#b91c1c;">アスト申込書の作成に失敗しました。<br>${escapeHtml(message)}</p>`);
        printWindow.document.close();
        showToast(message);
      });

    if (!saveToCustomer) {
      continueToTemplate();
      return;
    }

    setAstEditorBusy(true);
    google.script.run
      .withSuccessHandler((result) => {
        showToast(result.message || '顧客情報へ保存しました。');
        setAstEditorBusy(false);
        continueToTemplate();
      })
      .withFailureHandler((error) => {
        setAstEditorBusy(false);
        const message = error && error.message ? error.message : String(error);
        printWindow.document.open();
        printWindow.document.write(`<p style="font-family:sans-serif;padding:20px;color:#b91c1c;">顧客情報を保存できなかったため、PDF作成を中止しました。<br>${escapeHtml(message)}</p>`);
        printWindow.document.close();
        showToast(message);
      })
      .saveAstApplicationCustomerFields({
        rowKey: astEditorState.sourceRowKey,
        rowNumber: astEditorState.sourceRowNumber,
        saveToCustomer: true,
        form: values
      });
  }

  function loadAstTemplateDataUrl() {
    if (astTemplateDataUrlCache) return Promise.resolve(astTemplateDataUrlCache);
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((dataUrl) => {
          astTemplateDataUrlCache = dataUrl;
          resolve(dataUrl);
        })
        .withFailureHandler(reject)
        .getAstTemplateDataUrl();
    });
  }

  function buildAstPrintHtml(form, templateDataUrl, autoPrint, warnings) {
    const values = buildAstPrintValues(form);
    const pxToMm = (px) => ((px / AST_PRINT_CONFIG.page.dpi) * 25.4).toFixed(4);
    const fields = Object.keys(AST_PRINT_CONFIG.fields).map((key) => {
      const value = String(values[key] || '').trim();
      if (!value) return '';
      const field = AST_PRINT_CONFIG.fields[key];
      const fontSize = fitAstPrintFont(value, field);
      const className = `ast-print-value${field.multiline ? ' multiline' : ''}`;
      return `<div class="${className}" style="left:${pxToMm(field.x)}mm;top:${pxToMm(field.y)}mm;width:${pxToMm(field.width)}mm;height:${pxToMm(field.height)}mm;font-size:${pxToMm(fontSize)}mm;text-align:${field.align || 'left'};justify-content:${field.align === 'center' ? 'center' : field.align === 'right' ? 'flex-end' : 'flex-start'};">${escapeHtml(value)}</div>`;
    }).join('');
    const choices = Object.keys(AST_PRINT_CONFIG.choices).map((key) => {
      const selected = AST_PRINT_CONFIG.choices[key][form[key]];
      if (!selected) return '';
      return `<span class="ast-print-check" style="left:${pxToMm(selected[0])}mm;top:${pxToMm(selected[1])}mm;">✓</span>`;
    }).join('');
    const warningText = warnings.length ? `未入力・要確認 ${warnings.length}件` : '入力チェック済み';
    const autoPrintHandler = autoPrint ? 'setTimeout(function(){window.print();},450)' : '';
    return `<!doctype html>
      <html lang="ja">
        <head>
          <meta charset="utf-8">
          <title>アスト申込書</title>
          <style>
            @page { size: 515.905pt 728.504pt; margin: 0; }
            html, body { margin: 0; padding: 0; background: #e2e8f0; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; }
            .ast-print-toolbar { position: sticky; top: 0; z-index: 10; display: flex; gap: 10px; align-items: center; padding: 9px 12px; background: #14532d; color: #fff; }
            .ast-print-toolbar button { border: 0; border-radius: 6px; padding: 9px 15px; background: #fff; color: #14532d; font-weight: 700; cursor: pointer; }
            .ast-print-toolbar span { font-size: 12px; }
            .ast-print-warning { color: #fef3c7; font-weight: 700; }
            .ast-sheet { position: relative; width: 515.905pt; height: 728.504pt; margin: 12px auto; overflow: hidden; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.22); }
            .ast-sheet > img { position: absolute; inset: 0; width: 515.905pt; height: 728.504pt; z-index: 1; }
            .ast-print-value { position: absolute; z-index: 2; box-sizing: border-box; display: flex; align-items: center; overflow: hidden; color: #050505; font-weight: 600; line-height: 1.08; white-space: nowrap; letter-spacing: 0; }
            .ast-print-value.multiline { white-space: pre-wrap; word-break: break-all; align-content: center; }
            .ast-print-check { position: absolute; z-index: 3; color: #000; font-size: 2.2mm; line-height: 1; font-weight: 900; transform: translate(-45%, -30%); }
            @media print {
              html, body { width: 515.905pt; height: 728.504pt; background: #fff; }
              .ast-print-toolbar { display: none; }
              .ast-sheet { margin: 0; box-shadow: none; page-break-after: avoid; }
            }
          </style>
        </head>
        <body>
          <div class="ast-print-toolbar">
            <button type="button" onclick="window.print()">PDF保存・印刷</button>
            <span>用紙B5・倍率100%・余白なしで保存または印刷してください。</span>
            <span class="ast-print-warning">${escapeHtml(warningText)}</span>
          </div>
          <div class="ast-sheet">
            <img src="${templateDataUrl}" alt="アスト申込書原本" onload="${autoPrintHandler}">
            ${fields}
            ${choices}
          </div>
        </body>
      </html>`;
  }

  function fitAstPrintFont(value, field) {
    const units = Array.from(String(value || '')).reduce((sum, char) => sum + (/[ -~]/.test(char) ? .58 : 1), 0);
    const maxLines = field.multiline ? Math.max(1, Math.floor(field.height / (field.fontSize * 1.08))) : 1;
    const estimatedLineUnits = units / maxLines;
    const fitted = estimatedLineUnits * field.fontSize <= field.width
      ? field.fontSize
      : Math.floor(field.fontSize * (field.width / (estimatedLineUnits * field.fontSize)));
    return Math.max(field.minFontSize || (field.multiline ? 14 : 12), Math.min(field.fontSize, fitted));
  }

  function validateAstApplication(values) {
    const warnings = [];
    const required = [
      ['applicationDate', '申込日'], ['vehicleName', '車種名'], ['loanAmountManYen', '借入申込金額'],
      ['applicantKana', '申込者フリガナ'], ['applicantName', '申込者氏名'], ['gender', '性別'],
      ['birthEra', '生年月日の元号'], ['birthYear', '生年月日の年'], ['birthMonth', '生年月日の月'], ['birthDay', '生年月日の日'], ['age', '年齢'],
      ['postalCode', '郵便番号'], ['address', '住所'], ['housingType', '居住形態'],
      ['workplaceName', '勤務先名'], ['workAddress', '勤務先住所'], ['workPhone', '勤務先電話番号'],
      ['annualIncomeManYen', '年収']
    ];
    required.forEach(([key, label]) => { if (!String(values[key] || '').trim()) warnings.push(`${label}が未入力です`); });
    if (!values.homePhone && !values.mobilePhone) warnings.push('自宅電話または携帯電話が未入力です');
    [['postalCode', '郵便番号'], ['workPostalCode', '勤務先郵便番号']].forEach(([key, label]) => {
      const digits = astDigitsOnly(values[key]);
      if (digits && digits.length !== 7) warnings.push(`${label}は7桁で確認してください`);
    });
    [['homePhone', '自宅電話'], ['mobilePhone', '携帯電話'], ['emergencyPhone', '緊急連絡先電話'], ['workPhone', '勤務先電話']].forEach(([key, label]) => {
      const digits = astDigitsOnly(values[key]);
      if (digits && (digits.length < 10 || digits.length > 11)) warnings.push(`${label}は10〜11桁で確認してください`);
    });
    const birth = astEraToGregorian(values.birthEra, values.birthYear, values.birthMonth, values.birthDay);
    if (values.birthEra && values.birthYear && values.birthMonth && values.birthDay && !birth.valid) warnings.push('生年月日の日付を確認してください');
    if (birth.valid && values.age) {
      const calculatedAge = calculateAstAge(birth.year, birth.month, birth.day);
      if (String(calculatedAge) !== String(Number(astDigitsOnly(values.age)))) warnings.push(`年齢は生年月日から計算すると${calculatedAge}歳です`);
    }
    [['loanAmountManYen', '借入申込金額'], ['salePriceManYen', '売買価格'], ['tradeInPriceManYen', '下取価格'], ['annualIncomeManYen', '年収']].forEach(([key, label]) => {
      const text = String(values[key] || '').replace(/[,万円\s]/g, '');
      if (text && !/^\d+(?:\.\d+)?$/.test(text)) warnings.push(`${label}は数字で入力してください`);
      if (text && text.replace(/\D/g, '').length > 7) warnings.push(`${label}の桁数を確認してください`);
    });
    return Array.from(new Set(warnings));
  }

  function renderAstValidation(warnings) {
    const box = document.getElementById('astApplicationValidation');
    if (!warnings.length) {
      box.classList.remove('visible');
      box.innerHTML = '';
      return;
    }
    box.innerHTML = `<strong>アスト申込書の未入力項目があります</strong><ul>${warnings.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
    box.classList.add('visible');
  }

  function setAstEditorBusy(busy) {
    ['astResetButton', 'astPreviewButton', 'astCreatePdfButton', 'astApplicationCloseButton'].forEach((id) => {
      const button = document.getElementById(id);
      if (button) button.disabled = busy;
    });
  }

  function parseAstBirthDate(value) {
    const text = String(value || '').trim();
    let match = text.match(/(昭和|平成)\s*(\d{1,2})\D+(\d{1,2})\D+(\d{1,2})/);
    if (match) {
      const offset = match[1] === '昭和' ? 1925 : 1988;
      return { era: match[1], eraYear: match[2], month: match[3], day: match[4], gregorianYear: offset + Number(match[2]) };
    }
    match = text.match(/(19\d{2}|20\d{2})\D+(\d{1,2})\D+(\d{1,2})/);
    if (!match) return { era: '', eraYear: '', month: '', day: '', gregorianYear: 0 };
    const year = Number(match[1]);
    const era = year >= 1989 && year <= 2019 ? '平成' : year >= 1926 && year <= 1989 ? '昭和' : '';
    const eraYear = era === '平成' ? year - 1988 : era === '昭和' ? year - 1925 : '';
    return { era, eraYear: String(eraYear || ''), month: match[2], day: match[3], gregorianYear: year };
  }

  function astEraToGregorian(era, year, month, day) {
    const eraYear = Number(astDigitsOnly(year));
    const monthValue = Number(astDigitsOnly(month));
    const dayValue = Number(astDigitsOnly(day));
    if (!era || !eraYear || !monthValue || !dayValue) return { valid: false };
    const gregorianYear = era === '昭和' ? 1925 + eraYear : era === '平成' ? 1988 + eraYear : 0;
    if (!gregorianYear) return { valid: false };
    const date = new Date(gregorianYear, monthValue - 1, dayValue);
    const valid = date.getFullYear() === gregorianYear && date.getMonth() === monthValue - 1 && date.getDate() === dayValue;
    return { valid, year: gregorianYear, month: monthValue, day: dayValue };
  }

  function calculateAstAge(year, month, day) {
    const today = new Date();
    let age = today.getFullYear() - Number(year);
    if (today.getMonth() + 1 < Number(month) || (today.getMonth() + 1 === Number(month) && today.getDate() < Number(day))) age -= 1;
    return age >= 0 ? age : '';
  }

  function parseAstDuration(value) {
    const text = String(value || '');
    const year = text.match(/(\d+)\s*年/);
    const month = text.match(/(\d+)\s*(?:ヶ|か)?月/);
    if (year || month) return { years: year ? year[1] : '', months: month ? month[1] : '' };
    return { years: astDigitsOnly(text), months: '' };
  }

  function parseAstFamily(value) {
    const text = String(value || '');
    const children = text.match(/子(?:供)?\s*(\d+)\s*人/);
    const others = text.match(/(?:その他|親兄弟)\s*(\d+)\s*人/);
    return { children: children ? children[1] : '', others: others ? others[1] : '' };
  }

  function normalizeAstGender(value) {
    const text = String(value || '');
    if (text.indexOf('男') !== -1) return '男';
    if (text.indexOf('女') !== -1) return '女';
    return '';
  }

  function normalizeAstHousing(value) {
    const text = String(value || '').trim();
    if (/自己.*所有/.test(text)) return '自己所有';
    if (/(身内|家族|親族).*所有/.test(text)) return '身内所有';
    if (/(社宅|官舎)/.test(text)) return '社宅官舎';
    if (/一戸建.*借家/.test(text)) return '一戸建借家';
    if (/(賃貸.*(マンション|アパート)|(マンション|アパート).*賃貸)/.test(text)) return '賃貸マンション・アパート';
    if (/公営/.test(text)) return '公営住宅';
    return text ? 'その他' : '';
  }

  function normalizeAstSpouse(value) {
    const text = String(value || '').trim();
    if (/^(有|あり|いる|既婚)$/.test(text)) return '有';
    if (/^(無|なし|いない|未婚)$/.test(text)) return '無';
    return '';
  }

  function normalizeAstOccupation(value) {
    const text = String(value || '').trim();
    if (/(正社員|公務員|役員)/.test(text)) return '正社員・公務員・役員';
    if (/(パート|アルバイト)/.test(text)) return 'パート・アルバイト';
    if (/(有期|契約社員)/.test(text)) return '有期契約社員';
    if (/(法人.*経営|会社経営)/.test(text)) return '法人経営者';
    if (/(個人事業|自営業)/.test(text)) return '個人事業主';
    if (/年金/.test(text)) return '年金';
    if (/主婦/.test(text)) return '主婦';
    return text ? 'その他' : '';
  }

  function normalizeAstInsurance(value) {
    const text = String(value || '').trim();
    if (/社会保険/.test(text)) return '社会保険';
    if (/国民健康保険|国保/.test(text)) return '国民健康保険';
    if (/(共済|組合保険)/.test(text)) return '共済・組合保険';
    if (/船員保険/.test(text)) return '船員保険';
    if (/^(なし|無)$/.test(text)) return 'なし';
    return text ? 'その他' : '';
  }

  function astAmountToManYen(value, sourceIsYen) {
    const text = String(value || '').trim();
    if (!text) return '';
    const number = Number(text.replace(/[,円万円\s]/g, ''));
    if (!Number.isFinite(number)) return '';
    if (/万円/.test(text)) return String(number);
    if (sourceIsYen || number >= 10000) return String(number / 10000).replace(/\.0+$/, '');
    return String(number);
  }

  function astNumericText(value) {
    return String(value || '').replace(/[,万円\s]/g, '');
  }

  function astDigitsOnly(value) {
    return String(value || '').replace(/\D/g, '');
  }

  function formatAstPostalCode(value) {
    const digits = astDigitsOnly(value);
    return digits.length === 7 ? `${digits.slice(0, 3)}-${digits.slice(3)}` : String(value || '');
  }

  function parseAstDateInput(value) {
    const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return match ? { year: match[1], month: String(Number(match[2])), day: String(Number(match[3])) } : { year: '', month: '', day: '' };
  }

  function astTodayInputValue() {
    const date = new Date();
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  document.getElementById('astApplicationCloseButton').addEventListener('click', closeAstApplicationEditor);
  document.getElementById('astResetButton').addEventListener('click', resetAstApplicationForm);
  document.getElementById('astPreviewButton').addEventListener('click', previewAstApplication);
  document.getElementById('astCreatePdfButton').addEventListener('click', createAstApplicationPdf);
  document.getElementById('astApplicationModal').addEventListener('click', (event) => {
    if (event.target === event.currentTarget) closeAstApplicationEditor();
  });
</script>
