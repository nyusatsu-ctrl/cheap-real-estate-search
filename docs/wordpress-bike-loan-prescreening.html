<style>
  .ecoloop-prescreening,
  .ecoloop-prescreening * {
    box-sizing: border-box;
  }

  .ecoloop-prescreening {
    margin: 28px auto;
    max-width: 960px;
    font-family: inherit;
  }

  .ecoloop-prescreening [hidden] {
    display: none !important;
  }

  .ecoloop-prescreening-entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    border: 1px solid #fde68a;
    border-radius: 12px;
    background: #fffbeb;
    padding: 22px;
    color: #1f2937;
  }

  .ecoloop-prescreening-entry h2,
  .ecoloop-prescreening-dialog h2 {
    margin: 0;
    font-size: 24px;
    line-height: 1.35;
    color: #111827;
  }

  .ecoloop-prescreening-entry p,
  .ecoloop-prescreening-lead,
  .ecoloop-prescreening-result p {
    margin: 8px 0 0;
    font-size: 16px;
    line-height: 1.8;
  }

  .ecoloop-prescreening-eyebrow {
    margin: 0 0 6px;
    font-size: 13px;
    font-weight: 700;
    color: #b45309;
  }

  .ecoloop-prescreening-primary-button {
    appearance: none;
    border: 0;
    border-radius: 8px;
    background: #dc2626;
    color: #ffffff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
  }

  .ecoloop-prescreening-primary-button:hover,
  .ecoloop-prescreening-primary-button:focus {
    background: #b91c1c;
  }

  .ecoloop-prescreening-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
  }

  .ecoloop-prescreening-modal.ecoloop-prescreening-is-open {
    display: block;
  }

  .ecoloop-prescreening-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.62);
  }

  .ecoloop-prescreening-dialog {
    position: relative;
    margin: 36px auto;
    max-height: calc(100vh - 72px);
    max-width: 720px;
    overflow-y: auto;
    border-radius: 12px;
    background: #ffffff;
    padding: 28px;
    color: #111827;
    box-shadow: 0 24px 70px rgba(15, 23, 42, 0.3);
  }

  .ecoloop-prescreening-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 40px;
    height: 40px;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    background: #ffffff;
    cursor: pointer;
    font-size: 28px;
    line-height: 1;
    color: #374151;
  }

  .ecoloop-prescreening-form {
    display: grid;
    gap: 18px;
    margin-top: 20px;
  }

  .ecoloop-prescreening-field,
  .ecoloop-prescreening-fieldset {
    display: grid;
    gap: 8px;
    margin: 0;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px;
  }

  .ecoloop-prescreening-field span,
  .ecoloop-prescreening-fieldset legend {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.6;
    color: #111827;
  }

  .ecoloop-prescreening-field em,
  .ecoloop-prescreening-fieldset em {
    font-style: normal;
    color: #dc2626;
  }

  .ecoloop-prescreening-field select,
  .ecoloop-prescreening-field input[type="date"] {
    width: 100%;
    min-height: 44px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 16px;
    background: #ffffff;
    color: #111827;
  }

  .ecoloop-prescreening-fieldset label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    line-height: 1.5;
  }

  .ecoloop-prescreening-fieldset input[type="radio"] {
    width: 18px;
    height: 18px;
  }

  .ecoloop-prescreening-actions {
    display: flex;
    justify-content: flex-end;
  }

  .ecoloop-prescreening-error {
    min-height: 24px;
    margin: 0;
    color: #b91c1c;
    font-size: 14px;
    font-weight: 700;
  }

  .ecoloop-prescreening-result {
    border-radius: 10px;
    padding: 20px;
  }

  .ecoloop-prescreening-result.ecoloop-prescreening-result-ok {
    border: 1px solid #bbf7d0;
    background: #f0fdf4;
  }

  .ecoloop-prescreening-result.ecoloop-prescreening-result-ng {
    border: 1px solid #fecaca;
    background: #fef2f2;
  }

  #ecoloop-prescreening-application-form,
  [data-ecoloop-prescreening-application-form] {
    display: none;
  }

  #ecoloop-prescreening-application-form.ecoloop-prescreening-application-form-visible,
  [data-ecoloop-prescreening-application-form].ecoloop-prescreening-application-form-visible {
    display: block;
  }

  @media (max-width: 640px) {
    .ecoloop-prescreening-entry {
      display: grid;
      padding: 18px;
    }

    .ecoloop-prescreening-entry h2,
    .ecoloop-prescreening-dialog h2 {
      font-size: 21px;
    }

    .ecoloop-prescreening-dialog {
      margin: 16px;
      max-height: calc(100vh - 32px);
      padding: 22px 18px;
    }

    .ecoloop-prescreening-primary-button {
      width: 100%;
      white-space: normal;
    }

    .ecoloop-prescreening-actions {
      justify-content: stretch;
    }
  }
</style>

</div>

<script>
  (function () {
    "use strict";

    var PRE_SCREENING_PASS_REDIRECT_URL = "";

    var PRE_SCREENING_FORM_SELECTOR = "#ecoloop-prescreening-application-form, [data-ecoloop-prescreening-application-form]";

    var PRE_SCREENING_PASS_STORAGE_KEY = "ecoloopPreScreeningPassed";
    var PRE_SCREENING_RESULT_PARAM = "pre_screening_passed";
    var eligiblePrefectures = [
      "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県",
      "徳島県", "香川県", "愛媛県", "高知県",
      "鳥取県", "島根県", "岡山県"
    ];

    var root = document.getElementById("ecoloop-prescreening-root");
    if (!root) return;

    var modal = document.getElementById("ecoloop-prescreening-modal");
    var form = document.getElementById("ecoloop-prescreening-form");
    var formView = document.getElementById("ecoloop-prescreening-form-view");
    var resultView = document.getElementById("ecoloop-prescreening-result-view");
    var validationMessage = document.getElementById("ecoloop-prescreening-validation-message");
    function openModal() {
      modal.classList.add("ecoloop-prescreening-is-open");
      modal.setAttribute("aria-hidden", "false");
      document.documentElement.style.overflow = "hidden";
      var firstInput = modal.querySelector("select, input, button");
      if (firstInput) firstInput.focus();
    }

    function closeModal() {
      modal.classList.remove("ecoloop-prescreening-is-open");
      modal.setAttribute("aria-hidden", "true");
      document.documentElement.style.overflow = "";
    }

    function getRadioValue(name) {
      var checked = form.querySelector('input[name="' + name + '"]:checked');
      return checked ? checked.value : "";
    }

    function isEligibleArea(prefecture) {
      return eligiblePrefectures.indexOf(prefecture) !== -1;
    }

    function evaluatePreScreening(data) {
      var reasons = [];
      var eligibleArea = isEligibleArea(data.prefecture);

      if (!eligibleArea) {
        reasons.push("OUTSIDE_SERVICE_AREA");
      }
      if (data.unpaidDelinquency === "yes") {
        reasons.push("CURRENT_UNPAID_DELINQUENCY");
      }

      return {
        ok: reasons.length === 0,
        reasons: reasons,
        eligibleArea: eligibleArea
      };
    }

    function setValidationMessage(message) {
      validationMessage.textContent = message || "";
    }

    function validateForm() {
      setValidationMessage("");
      if (!form.reportValidity()) {
        setValidationMessage("未入力の項目があります。すべて回答してください。");
        return false;
      }
      return true;
    }

    function storePassState() {
      var payload = JSON.stringify({
        passed: true,
        passedAt: new Date().toISOString()
      });
      try {
        localStorage.setItem(PRE_SCREENING_PASS_STORAGE_KEY, payload);
        sessionStorage.setItem(PRE_SCREENING_PASS_STORAGE_KEY, payload);
      } catch (error) {
        // ストレージが使えない環境でもURLパラメータで通過状態を渡します。
      }
    }

    function clearPassState() {
      try {
        localStorage.removeItem(PRE_SCREENING_PASS_STORAGE_KEY);
        sessionStorage.removeItem(PRE_SCREENING_PASS_STORAGE_KEY);
      } catch (error) {
        // ストレージが使えない環境では何もしません。
      }
    }

    function hasPassState() {
      var params = new URLSearchParams(window.location.search);
      if (params.get(PRE_SCREENING_RESULT_PARAM) === "1") return true;
      try {
        return Boolean(localStorage.getItem(PRE_SCREENING_PASS_STORAGE_KEY) || sessionStorage.getItem(PRE_SCREENING_PASS_STORAGE_KEY));
      } catch (error) {
        return false;
      }
    }

    function findExistingApplicationUrl() {
      if (PRE_SCREENING_PASS_REDIRECT_URL) return PRE_SCREENING_PASS_REDIRECT_URL;
      var configuredLink = document.querySelector("[data-ecoloop-prescreening-form-url]");
      if (configuredLink) {
        return configuredLink.getAttribute("data-ecoloop-prescreening-form-url") || configuredLink.getAttribute("href") || "";
      }
      var links = Array.prototype.slice.call(document.querySelectorAll("a[href]"));
      var found = links.find(function (link) {
        return /仮審査|申し込み|申込み|申込|審査/.test((link.textContent || "").trim());
      });
      return found ? found.href : "";
    }

    function getApplicationFormElement() {
      return document.querySelector(PRE_SCREENING_FORM_SELECTOR);
    }

    function setApplicationFormVisible(isVisible) {
      var formElement = getApplicationFormElement();
      if (!formElement) return null;
      formElement.hidden = !isVisible;
      formElement.style.display = isVisible ? "block" : "none";
      formElement.setAttribute("aria-hidden", isVisible ? "false" : "true");
      formElement.classList.toggle("ecoloop-prescreening-application-form-visible", isVisible);
      return formElement;
    }

    function hideApplicationForm() {
      return setApplicationFormVisible(false);
    }

    function showApplicationForm() {
      return setApplicationFormVisible(true);
    }

    function goToApplicationForm() {
      storePassState();
      var url = PRE_SCREENING_PASS_REDIRECT_URL ? findExistingApplicationUrl() : "";
      if (url) {
        var nextUrl = new URL(url, window.location.href);
        nextUrl.searchParams.set(PRE_SCREENING_RESULT_PARAM, "1");
        window.location.href = nextUrl.toString();
        return;
      }
      var formElement = showApplicationForm();
      if (formElement) {
        closeModal();
        formElement.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      closeModal();
      alert("仮審査フォームを囲む要素が見つかりません。#ecoloop-prescreening-application-form で既存フォームを囲んでください。");
    }

    function renderResult(result) {
      if (form.elements.prescreening_result_code) {
        form.elements.prescreening_result_code.value = result.ok ? "OK" : "NG";
      }
      if (form.elements.prescreening_reason_codes) {
        form.elements.prescreening_reason_codes.value = result.reasons.join(",");
      }

      if (result.ok) {
        goToApplicationForm();
        return;
      }

      formView.hidden = true;
      resultView.hidden = false;
      resultView.className = "ecoloop-prescreening-result ecoloop-prescreening-result-ng";
      clearPassState();
      hideApplicationForm();
      var resultMessage = result.reasons.indexOf("OUTSIDE_SERVICE_AREA") !== -1
        ? "現在お住まいの地域は、当社バイク自社ローンの申込対象地域外のため、仮審査フォームへ進めません。申込対象地域は、九州全域、鳥取県・島根県・岡山県、四国全域です。"
        : "ご入力内容を確認した結果、現在の条件では仮審査へのお申し込みが難しい状況です。支払い状況が改善された後に、再度ご相談ください。";
      resultView.innerHTML =
        '<h2>現在の内容では仮審査に進めません</h2>' +
        '<p>' + resultMessage + '</p>' +
        '<div class="ecoloop-prescreening-actions" style="margin-top:16px;">' +
        '<button type="button" class="ecoloop-prescreening-primary-button" data-ecoloop-prescreening-close-result>閉じる</button>' +
        '</div>';
      resultView.querySelector("[data-ecoloop-prescreening-close-result]").addEventListener("click", closeModal);
    }

    function resetResultView() {
      formView.hidden = false;
      resultView.hidden = true;
      resultView.innerHTML = "";
      resultView.className = "ecoloop-prescreening-result";
    }

    function applyApplicationNoteIfPassed() {
      var params = new URLSearchParams(window.location.search);
      if (params.get(PRE_SCREENING_RESULT_PARAM) === "1") {
        showApplicationForm();
        return;
      }
      hideApplicationForm();
    }

    function guardApplicationLinks() {
      document.addEventListener("click", function (event) {
        var target = event.target.closest("[data-ecoloop-prescreening-requires-pass]");
        if (!target || hasPassState()) return;
        event.preventDefault();
        openModal();
      });
    }

    root.querySelectorAll("[data-ecoloop-prescreening-open]").forEach(function (button) {
      button.addEventListener("click", function () {
        resetResultView();
        openModal();
      });
    });

    modal.querySelectorAll("[data-ecoloop-prescreening-close]").forEach(function (button) {
      button.addEventListener("click", closeModal);
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && modal.classList.contains("ecoloop-prescreening-is-open")) {
        closeModal();
      }
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (!validateForm()) return;
      var data = {
        prefecture: form.elements.prefecture.value,
        unpaidDelinquency: getRadioValue("unpaidDelinquency")
      };
      renderResult(evaluatePreScreening(data));
    });

    applyApplicationNoteIfPassed();
    guardApplicationLinks();
  })();
</script>
